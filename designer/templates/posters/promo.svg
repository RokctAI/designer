<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- Product promo: one product photo, one price, one accent. -->
  <rect x="0" y="0" width="794" height="1123" fill="#f3f4f6" data-token="advertiser-4"/>
  <image data-slot="background" data-label="Background" x="0" y="0" width="794" height="600"/>
  <image data-slot="photo" data-label="Product photo" data-required="true" x="160" y="48" width="472" height="512"/>
  <text data-slot="headline" data-label="Headline" data-required="true" data-fit="shrink" data-fit-width="634" data-fit-height="64"
        x="80" y="664" font-size="48" font-weight="bold" fill="#111827" data-token="advertiser-3" font-family="DejaVu Sans">Headline</text>
  <text data-slot="details" data-label="Details" data-fit="shrink" data-fit-width="634" data-fit-height="24"
        x="80" y="712" font-size="20" fill="#111827" data-token="advertiser-3" font-family="DejaVu Sans">Details</text>
  <rect x="80" y="768" width="296" height="112" fill="#1a56db" data-token="advertiser-1"/>
  <text data-slot="price" data-label="Price" data-required="true" data-fit="shrink" data-fit-width="248" data-fit-height="64"
        x="104" y="848" font-size="48" font-weight="bold" fill="#ffffff" data-token="advertiser-5" font-family="DejaVu Sans">R0</text>
  <text data-slot="when" data-label="Valid until" data-fit="shrink" data-fit-width="306" data-fit-height="24"
        x="408" y="832" font-size="20" fill="#111827" data-token="advertiser-3" font-family="DejaVu Sans">Valid until</text>
  <rect x="0" y="968" width="794" height="155" fill="#111827" data-token="advertiser-3"/>
  <text data-slot="business" data-label="Business name" data-required="true" data-fit="shrink" data-fit-width="634" data-fit-height="40"
        x="80" y="1040" font-size="32" font-weight="bold" fill="#ffffff" data-token="advertiser-6" font-family="DejaVu Sans">Business</text>
  <text data-slot="contact" data-label="Contact (phone, WhatsApp, address)" data-fit="shrink" data-fit-width="634" data-fit-height="24"
        x="80" y="1080" font-size="20" fill="#ffffff" data-token="advertiser-6" font-family="DejaVu Sans">Contact</text>
</svg>
