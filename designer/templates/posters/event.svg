  <text x="112" y="768" font-size="16" font-weight="bold" fill="#1a56db" data-token="advertiser-1" font-family="DejaVu Sans">WHERE</text>
  <text data-slot="where" data-label="Venue or pickup point" data-required="true" data-fit="shrink" data-fit-width="578" data-fit-height="40"
        x="112" y="808" font-size="32" font-weight="bold" fill="#111827" data-token="advertiser-3" font-family="DejaVu Sans">Venue</text>
  <text data-slot="price" data-label="Price or entry" data-fit="shrink" data-fit-width="634" data-fit-height="64"
        x="80" y="928" font-size="48" font-weight="bold" fill="#1a56db" data-token="advertiser-1" font-family="DejaVu Sans">R0</text>
  <rect x="0" y="968" width="794" height="155" fill="#111827" data-token="advertiser-3"/>
  <text data-slot="business" data-label="Business name" data-required="true" data-fit="shrink" data-fit-width="634" data-fit-height="40"
