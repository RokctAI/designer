# Default design system — replace with your brand's tokens.
# Every value here is a rule the compliance engine will enforce and,
# where possible, auto-fix.
name: Default

color:
  # A token is either "name: #hex" or "name: {hex: ..., role: ...}".
  # Roles let snapping respect intent: big areas land on surface colors,
  # text on ink, small emphasis on accents.
  tokens:
    primary: { hex: "#1a56db", role: primary }
    primary-dark: { hex: "#1e3a8a", role: primary }
    accent: { hex: "#f59e0b", role: accent }
    ink: { hex: "#111827", role: ink }
    muted: { hex: "#6b7280", role: text }
    surface: { hex: "#f3f4f6", role: surface }
    white: { hex: "#ffffff", role: surface }
  # Hard cap on distinct colors in a single deliverable.
  max_colors: 6
  # OKLab distance beyond which a snap-to-token is flagged as aggressive.
  snap_warning_distance: 0.18

gradient:
  # Whether deliverables may contain gradients at all. When false,
  # detected gradients are flattened to the nearest token.
  allowed: true
  max_stops: 4

typography:
  fonts:
    - Inter
    - Helvetica Neue
    - Arial
    - sans-serif
  scale: [12, 14, 16, 20, 24, 32, 48, 64]

layout:
  # Base spacing/positioning grid in px. Primitive geometry snaps to it.
  grid: 8
  # Shapes smaller than this (px) are treated as noise and removed.
  min_element_size: 4
  # Edges closer together than this should be aligned outright.
  alignment_tolerance: 2
  role_aware_snapping: true

stroke:
  widths: [1, 2, 4, 8]

# Print production limits (enforced for print formats only).
print:
  bleed: 0            # px beyond trim; 0 = no bleed requirement
  min_stroke: 0.75    # thinnest line the press can hold
  max_ink_coverage: 300  # total CMYK ink %, 0 = unchecked
  # Path to your printer's CMYK ICC profile (not bundled — profiles are
  # licensed). When set, CMYK PDFs are converted through it and it is
  # embedded as the PDF's output intent; unset = naive conversion,
  # reported as unmanaged.
  # icc_profile: profiles/press.icc

accessibility:
  min_contrast_text: 4.5
  min_contrast_large_text: 3.0
  large_text_size: 24
