[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "designer-compliance"
version = "0.1.0"
description = "Design-system compliance engine: vectorize AI-generated designs and enforce brand standards automatically"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Text extraction from rasters (also requires the tesseract-ocr binary).
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
designer = "designer.cli:main"

[tool.setuptools.packages.find]
include = ["designer*"]

[tool.setuptools.package-data]
designer = ["systems/*.yaml"]
