<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5255.9 4547.2" width="5255.9" height="4547.2">
  <!-- A4 presentation folder, 445x385mm flat at 300dpi, 3mm bleed.
       Panel geometry follows the corporate-folder-a4 format: back
       cover (220mm) | capacity spine (5mm, x=2598.4..2657.5) | front
       cover (220mm), with the bottom 80mm strip (y>=3602.4) folding
       up into the pocket. Cover artwork stops at the pocket fold. -->
  <rect x="-35.4" y="-35.4" width="5326.7" height="4618" fill="#f3f4f6" data-token="advertiser-4"/>
  <!-- Front cover (right panel), down to the pocket fold. -->
  <rect x="2657.5" y="-35.4" width="2633.8" height="3637.8" fill="#1a56db" data-token="advertiser-1"/>
  <!-- Capacity spine. -->
  <rect x="2598.4" y="-35.4" width="59.1" height="4618" fill="#f59e0b" data-token="advertiser-2"/>
  <image data-slot="logo" x="3656.7" y="800" width="640" height="640" href=""/>
  <text data-slot="business-name" data-fit="shrink" data-fit-width="2300" data-fit-height="280"
        x="3976.7" y="1900" text-anchor="middle" font-size="240" font-weight="bold"
        fill="#ffffff" data-token="advertiser-5" font-family="DejaVu Sans">Business Name</text>
  <text data-slot="tagline" data-fit="shrink" data-fit-width="2300" data-fit-height="140"
        x="3976.7" y="2180" text-anchor="middle" font-size="110"
        fill="#ffffff" data-token="advertiser-5" font-family="DejaVu Sans">Tagline</text>
  <!-- Back cover (left panel): contact block above the pocket fold. -->
  <text data-slot="phone" data-fit="shrink" data-fit-width="2100" data-fit-height="120"
        x="300" y="3060" font-size="96" font-weight="bold"
        fill="#1a56db" data-token="advertiser-1" font-family="DejaVu Sans">Phone</text>
  <text data-slot="email" data-fit="shrink" data-fit-width="2100" data-fit-height="100"
        x="300" y="3240" font-size="80" fill="#111827"
        data-token="advertiser-3" font-family="DejaVu Sans">Email</text>
  <text data-slot="address" data-fit="shrink" data-fit-width="2100" data-fit-height="100"
        x="300" y="3400" font-size="80" fill="#111827"
        data-token="advertiser-3" font-family="DejaVu Sans">Address</text>
  <!-- Pocket strip: folds up along y=3602.4. -->
  <rect x="-35.4" y="3602.4" width="5326.7" height="980.2" fill="#ffffff" data-token="advertiser-6"/>
  <rect x="-35.4" y="3602.4" width="5326.7" height="30" fill="#f59e0b" data-token="advertiser-2"/>
</svg>
