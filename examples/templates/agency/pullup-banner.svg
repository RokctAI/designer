  <rect x="-35.4" y="-35.4" width="10109.8" height="6235.4" fill="#1a56db" data-token="advertiser-1"/>
  <image data-slot="logo" x="3519.5" y="800" width="3000" height="3000" href=""/>
  <text data-slot="business-name" data-fit="shrink" data-fit-width="9200" data-fit-height="950"
        x="5019.5" y="5100" text-anchor="middle"
        font-size="760" font-weight="bold" fill="#ffffff" data-token="advertiser-5"
        font-family="DejaVu Sans">Business Name</text>
  <rect x="2519.5" y="6200" width="5000" height="130" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="tagline" data-fit="shrink" data-fit-width="9200" data-fit-height="600"
