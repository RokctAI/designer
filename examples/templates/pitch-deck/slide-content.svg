<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pitch-deck content slide: kicker + heading + up to four point
       lines, optional hero image on the right. slide-16x9, no bleed. -->
  <rect x="0" y="0" width="1920" height="1080" fill="#f3f4f6" data-token="advertiser-4"/>
  <rect x="0" y="1064" width="1920" height="16" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="kicker" data-fit="shrink" data-fit-width="960" data-fit-height="32"
        x="160" y="176" font-size="24" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Kicker</text>
  <rect x="160" y="200" width="96" height="8" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="heading" data-fit="shrink" data-fit-width="960" data-fit-height="64"
        x="160" y="328" font-size="48" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Heading</text>
  <image data-slot="hero" x="1216" y="280" width="544" height="520" href=""/>
  <text data-slot="point-1" data-fit="shrink" data-fit-width="960" data-fit-height="40"
        x="160" y="488" font-size="32" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Point 1</text>
  <text data-slot="point-2" data-fit="shrink" data-fit-width="960" data-fit-height="40"
        x="160" y="576" font-size="32" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Point 2</text>
  <text data-slot="point-3" data-fit="shrink" data-fit-width="960" data-fit-height="40"
        x="160" y="664" font-size="32" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Point 3</text>
  <text data-slot="point-4" data-fit="shrink" data-fit-width="960" data-fit-height="40"
        x="160" y="752" font-size="32" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Point 4</text>
</svg>
