<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Pitch-deck data slide: kicker + heading over a metrics grid.
       The items region flows stat-cell.svg cells (label + value +
       optional delta), so market / traction / financials slides carry
       real numbers without a table renderer. slide-16x9, no bleed. -->
  <rect x="0" y="0" width="1920" height="1080" fill="#f3f4f6" data-token="advertiser-4"/>
  <rect x="0" y="1064" width="1920" height="16" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="kicker" data-fit="shrink" data-fit-width="1600" data-fit-height="32"
        x="160" y="176" font-size="24" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Kicker</text>
  <rect x="160" y="200" width="96" height="8" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="heading" data-fit="shrink" data-fit-width="1600" data-fit-height="64"
        x="160" y="328" font-size="48" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Heading</text>
  <rect data-region="items" data-min-cell="240" data-gutter="32"
        x="160" y="480" width="1600" height="240" fill="none"/>
  <text data-slot="footnote" data-fit="shrink" data-fit-width="1600" data-fit-height="28"
        x="160" y="976" font-size="20" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Footnote</text>
</svg>
