<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 794 1123" width="794" height="1123">
  <!-- Company-profile content page, a4-poster (794x1123 trim at 96dpi).
       Overview bullets, leadership block, track-record metrics (items
       region flowing record-cell.svg) and a contact block. All copy is
       ink-on-surface; the accent appears only as rules, the primary
       only as the bottom band. Backgrounds extend 40px past the trim
       (>= the 3mm/300dpi bleed) while staying on the 8px grid. -->
  <rect x="-40" y="-40" width="880" height="1208" fill="#f3f4f6" data-token="advertiser-4"/>
  <rect x="-40" y="1096" width="880" height="112" fill="#1a56db" data-token="advertiser-1"/>
  <text data-slot="kicker" data-fit="shrink" data-fit-width="664" data-fit-height="24"
        x="64" y="104" font-size="16" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Kicker</text>
  <rect x="64" y="120" width="96" height="8" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="heading" data-fit="shrink" data-fit-width="664" data-fit-height="40"
        x="64" y="192" font-size="32" font-weight="bold" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Heading</text>
  <text data-slot="point-1" data-fit="shrink" data-fit-width="664" data-fit-height="24"
