        data-token="advertiser-3" font-family="Inter">Point 4</text>
  <rect x="64" y="456" width="96" height="8" fill="#f59e0b" data-token="advertiser-2"/>
  <text data-slot="leadership-title" data-fit="shrink" data-fit-width="664" data-fit-height="32"
