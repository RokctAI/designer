  <text data-slot="lead-2" data-fit="shrink" data-fit-width="664" data-fit-height="24"
        x="64" y="616" font-size="16" fill="#111827"
        data-token="advertiser-3" font-family="Inter">Lead 2</text>
  <text data-slot="lead-3" data-fit="shrink" data-fit-width="664" data-fit-height="24"
